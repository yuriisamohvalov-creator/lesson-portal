[defaults]
inventory = inventory/hosts.yml
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
roles_path = ./roles
gathering = smart
fact_caching = memory
stdout_callback = yaml
bin_ansible_callbacks = True

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
