---
# Project identity
project_name: lessons-portal
project_root_on_control: "{{ playbook_dir | dirname | dirname | dirname }}"

# GitHub Container Registry (replaces gitlab.local:5050)
ghcr_owner: "{{ lookup('env', 'GITHUB_OWNER') | default('yuriisamohvalov-creator', true) }}"
ghcr_repo: "{{ lookup('env', 'GITHUB_REPO') | default('lesson-portal', true) }}"
ghcr_registry: "ghcr.io"
ghcr_prefix: "{{ ghcr_registry }}/{{ ghcr_owner }}/{{ ghcr_repo }}"

backend_image_name: "{{ ghcr_prefix }}-backend"
frontend_image_name: "{{ ghcr_prefix }}-frontend"

# Image tags are computed at runtime; override with --extra-vars.
git_commit_sha: "{{ lookup('pipe', 'git rev-parse HEAD 2>/dev/null || echo unknown') }}"
git_commit_short_sha: "{{ git_commit_sha[:8] }}"
git_commit_tag: "{{ lookup('pipe', 'git tag --points-at HEAD 2>/dev/null | head -n1 || true') }}"
git_branch: "{{ lookup('pipe', 'git rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown') }}"

image_movable_tag: >-
  {%- if git_commit_tag | length > 0 -%}{{ git_commit_tag }}
  {%- elif git_branch == 'stable-release' -%}stable-release
  {%- else -%}{{ git_branch | regex_replace('[^a-zA-Z0-9_.-]', '-') }}
  {%- endif -%}

# Compose files
compose_base: "docker-compose.yml"
compose_dev: "docker-compose.override.yml"
compose_prod: "docker-compose.prod.yml"

# NPM cache / registry used during image builds
npm_registry: "{{ lookup('env', 'NPM_REGISTRY') | default('https://registry.npmjs.org/', true) }}"

# Ports
local_backend_port: 3001
local_frontend_port: 3002
prod_backend_port: "{{ backend_port | default(3071) }}"
prod_frontend_port: "{{ frontend_port | default(3070) }}"
