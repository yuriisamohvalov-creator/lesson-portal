---
- name: Ensure encrypted .env exists on brix-pc
  ansible.builtin.stat:
    path: "{{ deploy_dir }}/.env"
  register: brix_env_stat
  failed_when: not brix_env_stat.stat.exists

- name: Ensure master key exists on brix-pc
  ansible.builtin.stat:
    path: "{{ secrets_master_key_file }}"
  register: master_key_stat
  failed_when: not master_key_stat.stat.exists

- name: Ensure deploy subdirectories exist
  ansible.builtin.file:
    path: "{{ deploy_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - deploy
    - nginx

- name: Sync compose files
  ansible.builtin.copy:
    src: "{{ project_root_on_control }}/{{ item }}"
    dest: "{{ deploy_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - "{{ compose_base }}"
    - "{{ compose_prod }}"

- name: Sync deploy scripts
  ansible.builtin.copy:
    src: "{{ project_root_on_control }}/deploy/{{ item }}"
    dest: "{{ deploy_dir }}/deploy/{{ item }}"
    mode: "0755"
  loop:
    - dockhand-deploy.sh
    - secrets.sh
    - deploy-brix-pc.sh

- name: Sync nginx config
  ansible.builtin.copy:
    src: "{{ project_root_on_control }}/nginx/"
    dest: "{{ deploy_dir }}/nginx/"
    mode: "0644"

- name: Remove dev override on brix-pc if present
  ansible.builtin.file:
    path: "{{ deploy_dir }}/{{ compose_dev }}"
    state: absent

- name: Decrypt .env to .env.runtime
  ansible.builtin.command: >
    bash {{ deploy_dir }}/deploy/secrets.sh decrypt-env
    {{ deploy_dir }}/.env
    {{ deploy_dir }}/.env.runtime
  environment:
    SECRETS_MASTER_KEY_FILE: "{{ secrets_master_key_file }}"
  changed_when: true
  no_log: true

- name: Pin backend image in .env.runtime
  ansible.builtin.lineinfile:
    path: "{{ deploy_dir }}/.env.runtime"
    regexp: '^BACKEND_IMAGE=.*'
    line: "BACKEND_IMAGE={{ backend_image_name }}:{{ deploy_image_tag | default(git_commit_short_sha) }}"
    create: true
    mode: "0600"

- name: Pin frontend image in .env.runtime
  ansible.builtin.lineinfile:
    path: "{{ deploy_dir }}/.env.runtime"
    regexp: '^FRONTEND_IMAGE=.*'
    line: "FRONTEND_IMAGE={{ frontend_image_name }}:{{ deploy_image_tag | default(git_commit_short_sha) }}"
    create: true
    mode: "0600"

- name: Ensure compose file override is set in .env.runtime
  ansible.builtin.lineinfile:
    path: "{{ deploy_dir }}/.env.runtime"
    regexp: '^COMPOSE_FILE=.*'
    line: "COMPOSE_FILE={{ compose_base }}:{{ compose_prod }}"
    create: true
    mode: "0600"

- name: Configure video catalog import mount in .env.runtime
  ansible.builtin.lineinfile:
    path: "{{ deploy_dir }}/.env.runtime"
    regexp: "^{{ item.key }}=.*"
    line: "{{ item.key }}={{ item.value }}"
    create: true
    mode: "0600"
  loop:
    - { key: "VIDEO_CATALOG_IMPORT_ROOTS", value: "{{ video_catalog_import_roots }}" }
    - { key: "VIDEO_CATALOG_IMPORT_HOST_PATH", value: "{{ video_catalog_import_host_path }}" }
    - { key: "VIDEO_CATALOG_IMPORT_CONTAINER_PATH", value: "{{ video_catalog_import_container_path }}" }

- name: Log in to GitHub Container Registry on brix-pc
  ansible.builtin.command: >
    docker login {{ ghcr_registry }}
    -u {{ ghcr_user }}
    --password-stdin
  args:
    stdin: "{{ vault_ghcr_token }}"
  changed_when: true
  no_log: true
  when: vault_ghcr_token is defined and vault_ghcr_token | length > 0

- name: Pull production images from registry
  ansible.builtin.command: >
    docker compose
    -f {{ compose_base }}
    -f {{ compose_prod }}
    --env-file {{ deploy_dir }}/.env.runtime
    pull
  args:
    chdir: "{{ deploy_dir }}"
  changed_when: true

- name: Pull and start production stack
  ansible.builtin.command: >
    docker compose
    -f {{ compose_base }}
    -f {{ compose_prod }}
    --env-file {{ deploy_dir }}/.env.runtime
    up -d --no-build --force-recreate --remove-orphans
  args:
    chdir: "{{ deploy_dir }}"
  changed_when: true

- name: Wait for backend health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prod_backend_port }}/health"
    status_code: 200
  register: backend_health_prod
  until: backend_health_prod.status == 200
  retries: 60
  delay: 3

- name: Apply database migrations
  ansible.builtin.command: >
    docker compose
    -f {{ compose_base }}
    -f {{ compose_prod }}
    --env-file {{ deploy_dir }}/.env.runtime
    exec -T backend npx prisma migrate deploy
  args:
    chdir: "{{ deploy_dir }}"
  changed_when: true

- name: Show production stack status
  ansible.builtin.command: >
    docker compose
    -f {{ compose_base }}
    -f {{ compose_prod }}
    --env-file {{ deploy_dir }}/.env.runtime
    ps
  args:
    chdir: "{{ deploy_dir }}"
  changed_when: false
