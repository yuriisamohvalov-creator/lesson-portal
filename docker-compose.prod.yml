# Production overrides — build runner images, bind to localhost only
services:
  postgres:
    restart: always

  minio:
    restart: always

  redis:
    restart: always

  backend:
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    environment:
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-https://lessons.samoh.ru}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3071}:3001"

  frontend:
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://lessons.samoh.ru}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://lessons.samoh.ru}
      API_INTERNAL_URL: http://backend:3001
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3070}:3000"
