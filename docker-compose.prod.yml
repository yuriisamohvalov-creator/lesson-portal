# Production overrides — pull prebuilt images, bind to localhost only
# BACKEND_IMAGE / FRONTEND_IMAGE come from .env.runtime (CI sets tags at deploy).
services:
  postgres:
    restart: always

  minio:
    restart: always
    ports:
      - "127.0.0.1:${MINIO_PORT:-3072}:9000"
    environment:
      MINIO_SERVER_URL: ${MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:3072}

  redis:
    restart: always

  backend:
    restart: always
    # Drop base `build:` so prod never compiles on brix (Compose Spec reset).
    build: !reset null
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set in .env.runtime}
    pull_policy: missing
    environment:
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-https://lessons.samoh.ru}
      VIDEO_CATALOG_IMPORT_ROOTS: ${VIDEO_CATALOG_IMPORT_ROOTS:-/app/6tb/lessons-portal/import}
    volumes:
      - ${VIDEO_CATALOG_IMPORT_HOST_PATH:?VIDEO_CATALOG_IMPORT_HOST_PATH must be set}:${VIDEO_CATALOG_IMPORT_CONTAINER_PATH:-/app/6tb/lessons-portal/import}:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3071}:3001"

  frontend:
    restart: always
    build: !reset null
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set in .env.runtime}
    pull_policy: missing
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://lessons.samoh.ru}
      API_INTERNAL_URL: http://backend:3001
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3070}:3000"
