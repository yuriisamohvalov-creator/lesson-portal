# Lessons Portal - Nginx Reverse Proxy
# Domain: lessons.samoh.ru
# Install: sudo ./setup.sh lessons.samoh.ru admin@samoh.ru

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=lessons_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=lessons_general:10m rate=60r/s;

upstream lessons_backend {
    server 127.0.0.1:3071;
    keepalive 32;
}

upstream lessons_frontend {
    server 127.0.0.1:3070;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name lessons.samoh.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lessons.samoh.ru;

    ssl_certificate /etc/letsencrypt/live/lessons.samoh.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lessons.samoh.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 500M;

    access_log /var/log/nginx/lessons-portal-access.log;
    error_log /var/log/nginx/lessons-portal-error.log warn;

    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # NestJS API (global prefix /api)
    location /api/ {
        limit_req zone=lessons_api burst=40 nodelay;

        proxy_pass http://lessons_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_buffering off;
    }

    # Health check (excluded from /api prefix in NestJS)
    location = /health {
        proxy_pass http://lessons_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /_next/static/ {
        proxy_pass http://lessons_frontend;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        limit_req zone=lessons_general burst=100 nodelay;

        proxy_pass http://lessons_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
