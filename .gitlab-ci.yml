# GitLab CI/CD for Lessons Portal
#
# Pipelines:
#   develop  -> deploy:local   (dev stack on runner host)
#   main     -> deploy:prod    (stable release to brix-pc)
#   tags     -> deploy:prod    (manual)
#
# Runner: shell executor on SER9, tag `lessons-portal`
# npm: Verdaccio proxy http://127.0.0.1:4873 + shared host cache
# Docs:   docs/gitlab-ci.md

stages:
  - test
  - deploy

# Avoid duplicate pipelines for the same commit (branch push + MR)
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  tags:
    - lessons-portal
  interruptible: true
  timeout: 20m

variables:
  GIT_DEPTH: "50"
  BRIX_PC_HOST: "192.168.150.90"
  BRIX_PC_USER: "ysamohvalov"
  BRIX_PC_DEPLOY_DIR: "/home/ysamohvalov/service/lessons-portal"
  # Shared across all shell runners on SER9
  npm_config_cache: "/home/gitlab-runner/.npm"
  npm_config_registry: "http://127.0.0.1:4873"
  npm_config_prefer_offline: "true"
  npm_config_fund: "false"
  npm_config_audit: "false"
  # Skip @prisma/client postinstall generate (engines still download via scripts).
  # Cap heap: Prisma generator defaults to 8096 and OOMs under concurrent jobs.
  # Prefer IPv4: IPv6 to binaries.prisma.sh is broken on this host and stalls downloads.
  PRISMA_SKIP_POSTINSTALL_GENERATE: "true"
  PRISMA_HIDE_UPDATE_MESSAGE: "true"
  NODE_OPTIONS: "--max-old-space-size=2048 --dns-result-order=ipv4first"

# --- Test (shell runner, Node.js on host) ---

backend:check:
  stage: test
  resource_group: npm-backend
  script:
    - cd backend
    # Keep scripts so @prisma/engines postinstall downloads binaries.
    # PRISMA_SKIP_POSTINSTALL_GENERATE skips only client generate during install.
    - npm ci --prefer-offline --no-audit --no-fund
    - npx prisma generate
    - npx tsc --noEmit
    - npm test -- --testPathPattern='\.spec\.ts$' --passWithNoTests --maxWorkers=2
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

frontend:check:
  stage: test
  resource_group: npm-frontend
  script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund
    - npx tsc --noEmit
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# --- Deploy: local dev stack on runner host (SER9) ---

deploy:local:
  stage: deploy
  resource_group: local
  needs:
    - job: backend:check
    - job: frontend:check
  script:
    - bash deploy/gitlab-local-deploy.sh
  environment:
    name: local
    url: http://localhost:3002
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# --- Deploy: stable prod on brix-pc ---

deploy:prod:
  stage: deploy
  resource_group: production
  needs:
    - job: backend:check
    - job: frontend:check
  script:
    - bash deploy/gitlab-prod-deploy.sh
  environment:
    name: production
    url: https://lessons.samoh.ru
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_COMMIT_TAG
      when: manual
