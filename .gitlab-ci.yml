# GitLab CI/CD for Lessons Portal
#
# Pipelines:
#   develop         -> deploy:local   (dev stack on runner host)
#   main            -> tests only (no prod deploy)
#   stable-release  -> build:images + deploy:prod (registry → brix pull)
#   tags            -> build:images + deploy:prod (manual)
#
# Runner: shell executor on SER9, tag `lessons-portal`
# npm: Verdaccio proxy http://127.0.0.1:4873 + shared host cache
# Docs:   docs/gitlab-ci.md

stages:
  - test
  - build
  - deploy

# Avoid duplicate pipelines for the same commit (branch push + MR)
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  tags:
    - lessons-portal
  interruptible: true
  timeout: 20m

variables:
  GIT_DEPTH: "50"
  BRIX_PC_HOST: "192.168.150.90"
  BRIX_PC_USER: "ysamohvalov"
  BRIX_PC_DEPLOY_DIR: "/home/ysamohvalov/service/lessons-portal"
  # Shared across all shell runners on SER9
  npm_config_cache: "/home/gitlab-runner/.npm"
  npm_config_registry: "http://127.0.0.1:4873"
  npm_config_prefer_offline: "true"
  npm_config_fund: "false"
  npm_config_audit: "false"
  PRISMA_SKIP_POSTINSTALL_GENERATE: "true"
  PRISMA_HIDE_UPDATE_MESSAGE: "true"
  NODE_OPTIONS: "--max-old-space-size=2048 --dns-result-order=ipv4first"
  NEXT_PUBLIC_API_URL: "https://lessons.samoh.ru"

# --- Test (shell runner, Node.js on host) ---

backend:check:
  stage: test
  resource_group: npm-backend
  script:
    - cd backend
    - npm ci --prefer-offline --no-audit --no-fund
    - npx prisma generate
    - npx tsc --noEmit
    - npm test -- --testPathPattern='\.spec\.ts$' --passWithNoTests --maxWorkers=2
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "stable-release"
    - if: $CI_COMMIT_BRANCH == "version2"

frontend:check:
  stage: test
  resource_group: npm-frontend
  script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund
    - npx tsc --noEmit
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "stable-release"
    - if: $CI_COMMIT_BRANCH == "version2"

# --- Build & push images to GitLab Container Registry ---

build:images:
  stage: build
  resource_group: docker-build
  interruptible: false
  needs:
    - job: backend:check
    - job: frontend:check
  script:
    - bash deploy/build-and-push-images.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "stable-release"
    - if: $CI_COMMIT_TAG
  timeout: 60m

# --- Deploy: local dev stack on runner host (SER9) ---

deploy:local:
  stage: deploy
  resource_group: local
  needs:
    - job: backend:check
    - job: frontend:check
  variables:
    LOCAL_DEPLOY_DIR: "/home/gitlab-runner/lessons-portal"
    LOCAL_ENV_FILE: "/home/ysamohvalov/project/lessons-portal/.env"
  script:
    - bash deploy/gitlab-local-deploy.sh
  environment:
    name: local
    url: http://localhost:3002
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "version2"

# --- Deploy: pull prebuilt images on brix-pc ---

deploy:prod:
  stage: deploy
  resource_group: production
  interruptible: false
  needs:
    - job: build:images
  script:
    - bash deploy/gitlab-prod-deploy.sh
  environment:
    name: production
    url: https://lessons.samoh.ru
  rules:
    - if: $CI_COMMIT_BRANCH == "stable-release"
      when: on_success
    - if: $CI_COMMIT_TAG
      when: manual
  timeout: 30m
