name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Run TypeScript check
        working-directory: backend
        run: npx tsc --noEmit

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Run unit tests
        working-directory: backend
        run: npm test -- --testPathPattern='\\.spec\\.ts$' --passWithNoTests

  backend-e2e-tests:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lessons_portal_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
        env:
          MINIO_ROOT_USER: minio_test
          MINIO_ROOT_PASSWORD: minio_test_password
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        volumes:
          - /tmp/minio-data:/data
        command: server /data
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/lessons_portal_test
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-jwt-refresh-secret
      JWT_EXPIRES_IN: 15m
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      MINIO_REGION: us-east-1
      MINIO_ROOT_USER: minio_test
      MINIO_ROOT_PASSWORD: minio_test_password
      MINIO_BUCKET: lessons-videos-test
      MAX_VIDEO_SIZE_MB: 500
      FRONTEND_URL: http://localhost:3002
      THROTTLE_AUTH_LIMIT: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Seed database
        working-directory: backend
        run: npx prisma db seed
      - name: Run e2e tests
        working-directory: backend
        run: npm run test:e2e

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Run TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-e2e-tests:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-e2e-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lessons_portal_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
        env:
          MINIO_ROOT_USER: minio_test
          MINIO_ROOT_PASSWORD: minio_test_password
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        volumes:
          - /tmp/minio-data:/data
        command: server /data
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/lessons_portal_test
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-jwt-refresh-secret
      JWT_EXPIRES_IN: 15m
      # Host-run Nest connects via published service ports
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      MINIO_REGION: us-east-1
      MINIO_ROOT_USER: minio_test
      MINIO_ROOT_PASSWORD: minio_test_password
      MINIO_BUCKET: lessons-videos-test
      MAX_VIDEO_SIZE_MB: 500
      FRONTEND_URL: http://localhost:3002
      THROTTLE_AUTH_LIMIT: 1000
      BASE_URL: http://localhost:3002
      API_INTERNAL_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_API_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Seed database
        working-directory: backend
        run: npx prisma db seed
      - name: Initialize MinIO bucket
        run: |
          docker run --rm --network host --entrypoint /bin/sh pgsty/mc:RELEASE.2026-09-16T00-00-00Z -c '
            mc alias set local http://127.0.0.1:9000 minio_test minio_test_password &&
            mc mb local/lessons-videos-test --ignore-existing &&
            mc anonymous set private local/lessons-videos-test
          '
      - name: Start backend
        working-directory: backend
        run: npm run start:dev > /tmp/backend.log 2>&1 &
      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3001/health >/dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to start"; tail -n 80 /tmp/backend.log; exit 1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Start frontend
        working-directory: frontend
        run: npm run dev -- -H 0.0.0.0 -p 3002 > /tmp/frontend.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3002/ >/dev/null; then
              echo "frontend ready"
              exit 0
            fi
            sleep 2
          done
          echo "frontend failed to start"; tail -n 80 /tmp/frontend.log; exit 1
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
