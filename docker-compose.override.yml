# Development overrides - hot reload, exposed ports for debugging
services:
  postgres:
    ports:
      - "5432:5432"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  redis:
    ports:
      - "6379:6379"

  backend:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
      network: host
    ports:
      - "3001:3001"
      - "9229:9229"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_OPTIONS: "--max-old-space-size=768"
      THROTTLE_AUTH_LIMIT: 1000
    volumes:
      - ./backend/src:/app/src
      - ./backend/node_modules:/app/node_modules

  frontend:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      network: host
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_INTERNAL_URL: http://backend:3001
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/node_modules:/app/node_modules
